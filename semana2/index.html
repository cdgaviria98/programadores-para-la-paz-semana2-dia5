<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participación Comunitaria | Formulario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section class="contenedor">
      <header>
        <h1>Participa por una comunidad informada</h1>
        <p>
          Este formulario permite recoger propuestas, ideas o necesidades de la comunidad. 
          La información será tratada con confidencialidad para fines de organización.
        </p>
      </header>

      <form id="form-participacion" action="#" method="POST">
        
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            placeholder="Ej: Juan Pérez"
            required
            aria-required="true">
        </div>

        <div class="campo">
          <label for="propuesta">Propuesta o mensaje</label>
          <textarea 
            id="propuesta" 
            name="propuesta" 
            rows="5"
            placeholder="¿Qué ideas tienes para mejorar nuestra comunidad?"
            required
            aria-required="true"></textarea>
        </div>

        <div class="campo">
          <label for="contacto">Correo o teléfono (opcional)</label>
          <input 
            type="text" 
            id="contacto" 
            name="contacto" 
            placeholder="ejemplo@correo.com o 300...">
        </div>

        <div class="campo-checkbox">
          <input 
            type="checkbox" 
            id="consentimiento" 
            name="consentimiento" 
            required>
          <label for="consentimiento">
            Acepto que mi información sea usada únicamente para fines de participación comunitaria.
          </label>
        </div>

        <div class="acciones">
          <button type="submit" class="boton-enviar">Enviar mi propuesta</button>
        </div>
      </form>
    </section>
  </main>

</body>
</html>
